name: Release

on:
  push:
    # Package releases only. The action's Marketplace tag (v1) deliberately
    # does not match, so moving it never republishes to PyPI.
    tags: ["v*.*.*"]

# Only a tag push reaches this, and only a maintainer can push a tag. The job
# below narrows to what it needs; actions are pinned by commit because this is
# the one workflow that touches the PyPI token.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Verify tag matches pyproject.toml version
      - name: Verify version consistency
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python -c "
          import re
          text = open('pyproject.toml').read()
          print(re.search(r'version\s*=\s*\"(.+?)\"', text).group(1))
          ")
          echo "Tag: $TAG_VERSION, Package: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: Tag $TAG_VERSION does not match pyproject.toml version $PKG_VERSION"
            exit 1
          fi

      # Run tests before release
      - name: Test gate
        run: |
          pip install -e ".[test]"
          pytest -q

      # Build
      - run: pip install build
      - run: python -m build

      # PyPI first — fail fast before creating GitHub Release
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      # GitHub Release only after PyPI succeeds
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true

  # Republish server.json so the MCP registry stops pointing at the previous
  # release. server.json carries the version, so skipping this leaves the registry
  # advertising a version that is no longer current -- and an agent installing from
  # it gets an older dbt-plan than the entry claims.
  #
  # A separate job on purpose. `release` holds PYPI_API_TOKEN; this one holds no
  # secret at all. GitHub OIDC is exchanged for a registry token at run time, so
  # id-token write is the entire permission surface, and the two never sit in the
  # same job.
  #
  # `needs: release` means PyPI and the GitHub Release have already succeeded. If
  # this step fails the release still shipped, and the run goes red so it is
  # obvious the registry needs a manual `mcp-publisher publish`.
  publish-registry:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # mcp-publisher is a Go binary from the registry's releases, not a package on
      # PyPI or npm. Fetched with curl rather than as an action, so the allowlist
      # and SHA pinning that cover `uses:` do not apply -- the checksum replaces them.
      - name: Install mcp-publisher
        env:
          VERSION: v1.8.1
          SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          curl -fsSL -o publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/$VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$SHA256  publisher.tar.gz" | sha256sum -c -
          tar xzf publisher.tar.gz mcp-publisher

      # Catches a malformed manifest before authenticating rather than after. The
      # registry caps description at 100 characters and returns 422, which is how
      # the first version of this manifest was found to be invalid.
      - name: Validate
        run: ./mcp-publisher validate

      - name: Publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
