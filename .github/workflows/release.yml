name: Release

on:
  push:
    # Package releases only. The action's Marketplace tag (v1) deliberately
    # does not match, so moving it never republishes to PyPI.
    tags: ["v*.*.*"]

# Only a tag push reaches this, and only a maintainer can push a tag. The job
# below narrows to what it needs; actions are pinned by commit because this is
# the one workflow that touches the PyPI token.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Verify tag matches pyproject.toml version
      - name: Verify version consistency
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python -c "
          import re
          text = open('pyproject.toml').read()
          print(re.search(r'version\s*=\s*\"(.+?)\"', text).group(1))
          ")
          echo "Tag: $TAG_VERSION, Package: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: Tag $TAG_VERSION does not match pyproject.toml version $PKG_VERSION"
            exit 1
          fi

      # Run tests before release
      - name: Test gate
        run: |
          pip install -e ".[test]"
          pytest -q

      # Build
      - run: pip install build
      - run: python -m build

      # PyPI first — fail fast before creating GitHub Release
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      # GitHub Release only after PyPI succeeds
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
