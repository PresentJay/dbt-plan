name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI only ever reads the checkout. Pull requests from forks already run with a
# read-only token and no access to secrets because this triggers on
# `pull_request` rather than `pull_request_target` -- stating it here means a
# change to that trigger cannot quietly widen what a fork's code can reach.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - name: Test CI feedback controls
        run: node --test .github/scripts/ci-feedback.test.cjs

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest -v --cov=dbt_plan --cov-report=term-missing

  test-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest -v --cov=dbt_plan --cov-report=term-missing

  # The floor in pyproject.toml is a promise. sqlglot < 28 extracts
  # `SELECT * EXCEPT(col)` as plain `*`, which hides a dropped column —
  # a false safe. Pin the declared minimum here so it can never regress.
  minimum-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - run: pip install -e ".[test]"
      - run: pip install sqlglot==28.0.0
      - run: pytest -q

  integrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[test,dbt,mcp]" uv dbt-core==1.11.7 dbt-duckdb==1.10.1
      - run: python .github/scripts/required-tests.py tests/test_dbt_e2e.py tests/test_mcp_server.py tests/test_review_safety_gaps.py tests/test_generated_ci_execution.py tests/test_generated_ci_install.py tests/test_action_e2e.py tests/test_compiled_fixture.py -q

      - name: Prepare real composite Action projects and current wheel
        id: action-projects
        run: |
          python -m tests.action_project prepare "$RUNNER_TEMP/action-projects"
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/action-wheels" .
          python -m pip uninstall -y dbt-plan
      - name: Composite Action safe
        id: action-safe
        continue-on-error: true
        uses: ./
        env:
          PIP_NO_INDEX: '1'
          PIP_FIND_LINKS: ${{ runner.temp }}/action-wheels
          DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
        with:
          project-dir: ${{ runner.temp }}/action-projects/safe
          base-ref: ${{ steps.action-projects.outputs.safe-base }}
          target-dir: compiled target
          compile-command: "git rev-parse HEAD >> compile.log; dbt compile --profiles-dir . --target-path 'compiled target'"
          fail-on: destructive
      - name: Verify composite Action safe
        env:
          OUTCOME: ${{ steps.action-safe.outcome }}
          CODE: ${{ steps.action-safe.outputs.exit-code }}
          VERDICT: ${{ steps.action-safe.outputs.verdict }}
          REPORT: ${{ steps.action-safe.outputs.report }}
        run: python -m tests.action_project verify "$RUNNER_TEMP/action-projects" safe "$OUTCOME" "$CODE" "$VERDICT" "$REPORT"
      - name: Composite Action warning
        id: action-warning
        continue-on-error: true
        uses: ./
        env:
          PIP_NO_INDEX: '1'
          PIP_FIND_LINKS: ${{ runner.temp }}/action-wheels
          DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
        with:
          project-dir: ${{ runner.temp }}/action-projects/warning
          base-ref: ${{ steps.action-projects.outputs.warning-base }}
          target-dir: compiled target
          compile-command: "git rev-parse HEAD >> compile.log; dbt compile --profiles-dir . --target-path 'compiled target'"
          fail-on: destructive
      - name: Verify composite Action warning
        env:
          OUTCOME: ${{ steps.action-warning.outcome }}
          CODE: ${{ steps.action-warning.outputs.exit-code }}
          VERDICT: ${{ steps.action-warning.outputs.verdict }}
          REPORT: ${{ steps.action-warning.outputs.report }}
        run: python -m tests.action_project verify "$RUNNER_TEMP/action-projects" warning "$OUTCOME" "$CODE" "$VERDICT" "$REPORT"
      - name: Composite Action destructive
        id: action-destructive
        continue-on-error: true
        uses: ./
        env:
          PIP_NO_INDEX: '1'
          PIP_FIND_LINKS: ${{ runner.temp }}/action-wheels
          DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
        with:
          project-dir: ${{ runner.temp }}/action-projects/destructive
          base-ref: ${{ steps.action-projects.outputs.destructive-base }}
          target-dir: compiled target
          compile-command: "git rev-parse HEAD >> compile.log; dbt compile --profiles-dir . --target-path 'compiled target'"
          fail-on: destructive
      - name: Verify composite Action destructive
        env:
          OUTCOME: ${{ steps.action-destructive.outcome }}
          CODE: ${{ steps.action-destructive.outputs.exit-code }}
          VERDICT: ${{ steps.action-destructive.outputs.verdict }}
          REPORT: ${{ steps.action-destructive.outputs.report }}
        run: python -m tests.action_project verify "$RUNNER_TEMP/action-projects" destructive "$OUTCOME" "$CODE" "$VERDICT" "$REPORT"
      - name: Composite Action base-error
        id: action-base-error
        continue-on-error: true
        uses: ./
        env:
          PIP_NO_INDEX: '1'
          PIP_FIND_LINKS: ${{ runner.temp }}/action-wheels
          DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
        with:
          project-dir: ${{ runner.temp }}/action-projects/base-error
          base-ref: ${{ steps.action-projects.outputs.base-error-base }}
          target-dir: compiled target
          compile-command: "git rev-parse HEAD >> compile.log; dbt compile --profiles-dir . --target-path 'compiled target'"
          fail-on: never
      - name: Verify composite Action base-error
        env:
          OUTCOME: ${{ steps.action-base-error.outcome }}
          CODE: ${{ steps.action-base-error.outputs.exit-code }}
          VERDICT: ${{ steps.action-base-error.outputs.verdict }}
          REPORT: ${{ steps.action-base-error.outputs.report }}
        run: python -m tests.action_project verify "$RUNNER_TEMP/action-projects" base-error "$OUTCOME" "$CODE" "$VERDICT" "$REPORT"
      - name: Composite Action head-error
        id: action-head-error
        continue-on-error: true
        uses: ./
        env:
          PIP_NO_INDEX: '1'
          PIP_FIND_LINKS: ${{ runner.temp }}/action-wheels
          DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
        with:
          project-dir: ${{ runner.temp }}/action-projects/head-error
          base-ref: ${{ steps.action-projects.outputs.head-error-base }}
          target-dir: compiled target
          compile-command: "git rev-parse HEAD >> compile.log; dbt compile --profiles-dir . --target-path 'compiled target'"
          fail-on: never
      - name: Verify composite Action head-error
        env:
          OUTCOME: ${{ steps.action-head-error.outcome }}
          CODE: ${{ steps.action-head-error.outputs.exit-code }}
          VERDICT: ${{ steps.action-head-error.outputs.verdict }}
          REPORT: ${{ steps.action-head-error.outputs.report }}
        run: python -m tests.action_project verify "$RUNNER_TEMP/action-projects" head-error "$OUTCOME" "$CODE" "$VERDICT" "$REPORT"

  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]" build
      - run: python -m build
      - run: python .github/scripts/required-tests.py tests/test_packaging.py -q
