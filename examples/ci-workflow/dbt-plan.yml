name: dbt-plan
# dbt-plan itself never connects to your warehouse, but `dbt compile` does.
# That compile runs Jinja and macros authored in the pull request, so treat it
# as running untrusted code with credentials attached:
#
#   * Keep the `pull_request` trigger. NEVER change it to `pull_request_target`
#     -- that hands your warehouse secrets to code from any fork.
#   * Give the CI account the least privilege that still compiles: log in plus
#     USAGE on the warehouse. `dbt compile` reads no tables unless your macros
#     introspect (run_query / get_column_values / get_columns_in_relation).
#   * Fork PRs receive no secrets by design; the Preflight step says so plainly
#     instead of failing later with a confusing driver error.
on:
  # Every PR: custom paths, packages and YAML/Jinja settings can change compiled SQL.
  pull_request: {}

concurrency:
  group: dbt-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: DDL Impact Check
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    # Results go to the step summary, which needs no token scope.
    permissions:
      contents: read
    # Optional: gate secret access behind a protected environment.
    # environment: dbt-plan-ci

    # Credentials for `dbt compile`. profiles.yml should read these via
    # env_var(). Declaring them here -- rather than interpolating
    # ${{ secrets.* }} inside a `run:` block -- keeps the values out of the
    # command line and out of any script the PR could influence.
    # Non-secret settings (account, user, role) are better kept in `vars`.
    env:
      # Uncomment if profiles.yml lives in the repo root rather than ~/.dbt/.
      # DBT_PROFILES_DIR: ${{ github.workspace }}
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      # Key-pair auth; prefer it over a password. Paste the full PEM.
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
      # Postgres / Redshift replace the SNOWFLAKE_* lines above with just:
      # PGPASSWORD: ${{ secrets.PGPASSWORD }}
      # BigQuery needs no variable here. Add a google-github-actions/auth step
      # for keyless OIDC, which also requires id-token: write on the job.

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          # dbt compile runs PR-authored code -- leave no git token on disk.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      # Fail fast and legibly. Change the variable below to whichever one your
      # profiles.yml requires -- or drop this step entirely if you authenticate
      # without a secret, as BigQuery OIDC does.
      - name: Preflight
        run: |
          if [ -z "$SNOWFLAKE_PRIVATE_KEY" ]; then
            echo "::error::dbt compile needs warehouse credentials, but none are set."
            echo "Add them under Settings > Secrets and variables > Actions."
            echo "Fork PRs never receive secrets - run this from a branch in this repo."
            exit 1
          fi

      - name: Install
        run: |
          python -m pip install uv
          # Outside the checkout: switching revisions cannot replace this environment.
          export UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/dbt-plan-venv"
          if [ -f pyproject.toml ]; then
            if [ -f uv.lock ]; then
              uv sync --locked
            else
              uv sync
              # uv created this untracked lock. Do not let it obstruct checkout
              # of a baseline that does track uv.lock; no existing lock is removed.
              rm -f uv.lock
            fi
          elif [ -f requirements.txt ]; then
            uv venv "$UV_PROJECT_ENVIRONMENT"
            uv pip install --python "$UV_PROJECT_ENVIRONMENT/bin/python" -r requirements.txt
          else
            echo "::error::Add pyproject.toml or requirements.txt with your dbt adapter dependencies."
            exit 3
          fi
          uv pip install --python "$UV_PROJECT_ENVIRONMENT/bin/python" dbt-plan
          if [ ! -x "$UV_PROJECT_ENVIRONMENT/bin/dbt" ]; then
            echo "::error::Project dependencies must install dbt and its adapter. Adjust the Install step for optional dependency groups."
            exit 3
          fi
          # All later steps use these installed commands, without uv run re-syncing.
          echo "$UV_PROJECT_ENVIRONMENT/bin" >> "$GITHUB_PATH"

      - name: Snapshot base
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          git checkout --detach "$BASE_REF"
          dbt compile
          dbt-plan snapshot

      - name: Check current
        id: check
        env:
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: |
          git checkout --detach "$HEAD_REF"
          dbt compile
          code=0
          report="$RUNNER_TEMP/dbt-plan-report.json"
          # Override only the new policy; retain legacy warning codes and acknowledgements.
          # Older pinned packages ignore this environment variable (no new CLI flag).
          export DBT_PLAN_FAIL_ON=warning
          if ! policy=$(python -c 'from dbt_plan.config import Config; print("destructive" if Config.load().warning_exit_code == 0 else "warning")'); then
            echo "::error::Could not resolve dbt-plan warning policy"
            exit 3
          fi
          export DBT_PLAN_FAIL_ON="$policy"
          dbt-plan check --format json > "$report" || code=$?
          # Older releases also used codes 1/2 for execution failures. No report
          # means no verdict, regardless of a user-selected warning policy.
          if ! verdict=$(python - "$report" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              data = json.load(stream)
          if not isinstance(data, dict):
              raise ValueError("report must be an object")
          summary, models = data.get("summary"), data.get("models")
          if not isinstance(summary, dict) or not isinstance(models, list):
              raise ValueError("report needs summary and models")
          levels = ("safe", "warning", "destructive")
          for key in ("total", *levels):
              if type(summary.get(key)) is not int or summary[key] < 0:
                  raise ValueError("invalid summary count")
          counts = dict.fromkeys(levels, 0)
          for model in models:
              if not isinstance(model, dict) or model.get("safety") not in levels:
                  raise ValueError("invalid model safety")
              counts[model["safety"]] += 1
          if summary["total"] != len(models) or any(summary[k] != counts[k] for k in levels):
              raise ValueError("summary does not match models")
          uncertain = False
          for key in ("parse_failures", "skipped_models", "uncompiled_models", "stale_sources"):
              values = data.get(key, [])
              if not isinstance(values, list) or any(not isinstance(v, str) for v in values):
                  raise ValueError("invalid uncertainty list")
              uncertain = uncertain or bool(values)
          if "baseline_problem" in data:
              if not isinstance(data["baseline_problem"], str):
                  raise ValueError("invalid baseline problem")
              uncertain = uncertain or bool(data["baseline_problem"])
          nested = set()
          for model in models:
              impacts = model.get("downstream_impacts", [])
              if not isinstance(impacts, list):
                  raise ValueError("invalid downstream impacts")
              for impact in impacts:
                  if not isinstance(impact, dict) or any(
                      not isinstance(impact.get(key), str) for key in ("model_name", "risk", "reason")
                  ):
                      raise ValueError("invalid downstream impact")
                  nested.add("destructive" if impact["risk"] in ("broken_ref", "inherited_drop") else "warning")
          # The validator ships in the base wheel and imports only the stdlib.
          # Old pinned CLIs have no canonical field and need no new module.
          if "findings" in data:
              from dbt_plan_mcp.report_validation import validate_report, report_severity
              nested.add(report_severity(validate_report(data)))
          print("destructive" if counts["destructive"] or "destructive" in nested else
                "warning" if counts["warning"] or uncertain or "warning" in nested else "safe")
          PY
          ); then
            echo "::error::dbt-plan did not produce a completed JSON report (exit $code)"
            code=3
          fi
          echo "exit-code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0|1|2) echo "verdict=$verdict" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Report
        continue-on-error: true
        env:
          CODE: ${{ steps.check.outputs.exit-code }}
        run: |
          case "$CODE" in
            0|1|2) ;;
            *) echo "dbt-plan could not complete (exit $CODE). See the Check current logs." >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
          esac
          rendered=0
          markdown="$RUNNER_TEMP/dbt-plan-report.md"
          # Override only the new policy; retain legacy warning codes and acknowledgements.
          # Older pinned packages ignore this environment variable (no new CLI flag).
          export DBT_PLAN_FAIL_ON=warning
          if ! policy=$(python -c 'from dbt_plan.config import Config; print("destructive" if Config.load().warning_exit_code == 0 else "warning")'); then
            echo "::error::Could not resolve dbt-plan warning policy"
            exit 3
          fi
          export DBT_PLAN_FAIL_ON="$policy"
          dbt-plan check --format github > "$markdown" || rendered=$?
          case "$rendered" in
            0|1|2)
              if [ -s "$markdown" ]; then
                cat "$markdown" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi ;;
          esac
          # Keep the validated report visible if Markdown rendering fails.
          echo 'Markdown unavailable; original JSON report:' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/dbt-plan-report.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Gate
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        env:
          CODE: ${{ steps.check.outputs.exit-code }}
          # warning: block warnings too; never: allow findings, but not execution errors.
          FAIL_ON: destructive
        run: |
          case "$CODE" in
            0|1|2) ;;
            *) echo "::error::dbt-plan execution failed (exit $CODE). Fix the error and rerun."; exit 3 ;;
          esac
          case "$FAIL_ON" in
            never) exit 0 ;;
            destructive) [ "$CODE" != "1" ] || exit 1 ;;
            warning) [ "$CODE" = "0" ] || exit 1 ;;
            *) echo "::error::FAIL_ON must be destructive, warning, or never"; exit 3 ;;
          esac
