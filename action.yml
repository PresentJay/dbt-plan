name: dbt-plan
description: Warn about destructive dbt schema changes before dbt run. Like terraform plan, for dbt.
author: PresentJay

branding:
  icon: alert-triangle
  color: yellow

inputs:
  compile-command:
    description: >-
      Command that produces target/compiled/ and target/manifest.json. Runs twice, once on
      the base revision and once on yours. It needs whatever credentials your dbt profile
      needs -- dbt-plan itself never connects to a warehouse.
    default: dbt compile
  base-ref:
    description: >-
      Revision to compare against. Defaults to the pull request base. Requires the caller to
      check out with fetch-depth: 0, since a shallow clone does not contain it.
    default: ${{ github.event.pull_request.base.sha }}
  project-dir:
    description: dbt project directory.
    default: .
  target-dir:
    description: dbt target directory, relative to project-dir.
    default: target
  dialect:
    description: >-
      Optional sqlglot dialect override. Empty preserves CLI configuration and manifest
      adapter detection, with snowflake as the fallback.
    default: ''
  version:
    description: dbt-plan version to install. Empty installs the latest release.
    default: ''
  fail-on:
    description: >-
      Which verdict fails the job: destructive, warning, or never. "warning" honours
      warning_exit_code from .dbt-plan.yml, so setting that to 0 opts out of it.
      Execution errors always fail, including when fail-on is never.
    default: destructive
  summary:
    description: Write the report to the job step summary.
    default: 'true'

outputs:
  verdict:
    description: Raw report severity (safe, destructive, or warning), independent of exit policy.
    value: ${{ steps.check.outputs.verdict }}
  exit-code:
    description: Policy exit code -- 0 allowed, 1 destructive, 2 warning, 3 execution error (no verdict).
    value: ${{ steps.check.outputs.exit-code }}
  report:
    description: Path to the JSON report.
    value: ${{ steps.check.outputs.report }}

# Inputs are passed through env rather than interpolated into run:, so a value
# containing shell metacharacters cannot become a command.
runs:
  using: composite
  steps:
    - name: Install dbt-plan
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -eu
        if [ -n "$VERSION" ]; then
          pip install --quiet "dbt-plan==$VERSION"
        else
          pip install --quiet dbt-plan
        fi
        dbt-plan --version

    - name: Snapshot base
      shell: bash
      working-directory: ${{ inputs.project-dir }}
      env:
        BASE_REF: ${{ inputs.base-ref }}
        COMPILE: ${{ inputs.compile-command }}
        TARGET_DIR: ${{ inputs.target-dir }}
      run: |
        set -eu
        if [ -z "$BASE_REF" ]; then
          echo "::error::base-ref is empty. Outside a pull_request event, set it explicitly."
          exit 1
        fi
        if ! git cat-file -e "$BASE_REF^{commit}" 2>/dev/null; then
          echo "::error::base-ref $BASE_REF is not in this clone. Check out with fetch-depth: 0."
          exit 1
        fi
        git rev-parse HEAD > "$RUNNER_TEMP/dbt-plan-head"
        git checkout --detach --quiet "$BASE_REF"
        eval "$COMPILE"
        dbt-plan snapshot --target-dir "$TARGET_DIR"

    - name: Compile current
      shell: bash
      working-directory: ${{ inputs.project-dir }}
      env:
        COMPILE: ${{ inputs.compile-command }}
      run: |
        set -eu
        git checkout --detach --quiet "$(cat "$RUNNER_TEMP/dbt-plan-head")"
        eval "$COMPILE"

    - name: Check
      id: check
      shell: bash
      working-directory: ${{ inputs.project-dir }}
      env:
        DIALECT: ${{ inputs.dialect }}
        SUMMARY: ${{ inputs.summary }}
        TARGET_DIR: ${{ inputs.target-dir }}
      run: |
        set -u
        set --
        if [ -n "$DIALECT" ]; then
          set -- --dialect "$DIALECT"
        fi
        report="$RUNNER_TEMP/dbt-plan-report.json"
        # Override only the new policy; retain legacy warning codes and acknowledgements.
        # Older pinned packages ignore this environment variable (no new CLI flag).
        export DBT_PLAN_FAIL_ON=warning
        if ! policy=$(python -c 'from dbt_plan.config import Config; print("destructive" if Config.load().warning_exit_code == 0 else "warning")'); then
          echo "::error::Could not resolve dbt-plan warning policy"
          exit 3
        fi
        export DBT_PLAN_FAIL_ON="$policy"
        code=0
        dbt-plan check --target-dir "$TARGET_DIR" "$@" --format json > "$report" || code=$?
        case "$code" in
          0|1|2) ;;
          *) echo "::error::dbt-plan exited $code"; cat "$report"; exit "$code" ;;
        esac
        # Older package versions use verdict codes for errors too. Require a
        # report before applying policy, including when version pins 0.15.x.
        if ! verdict=$(python - "$report" <<'PY'
        import json, sys
        with open(sys.argv[1], encoding="utf-8") as stream:
            data = json.load(stream)
        if not isinstance(data, dict):
            raise ValueError("report must be an object")
        summary, models = data.get("summary"), data.get("models")
        if not isinstance(summary, dict) or not isinstance(models, list):
            raise ValueError("report needs summary and models")
        levels = ("safe", "warning", "destructive")
        for key in ("total", *levels):
            if type(summary.get(key)) is not int or summary[key] < 0:
                raise ValueError("invalid summary count")
        counts = dict.fromkeys(levels, 0)
        for model in models:
            if not isinstance(model, dict) or model.get("safety") not in levels:
                raise ValueError("invalid model safety")
            counts[model["safety"]] += 1
        if summary["total"] != len(models) or any(summary[k] != counts[k] for k in levels):
            raise ValueError("summary does not match models")
        uncertain = False
        for key in ("parse_failures", "skipped_models", "uncompiled_models", "stale_sources"):
            values = data.get(key, [])
            if not isinstance(values, list) or any(not isinstance(v, str) for v in values):
                raise ValueError("invalid uncertainty list")
            uncertain = uncertain or bool(values)
        if "baseline_problem" in data:
            if not isinstance(data["baseline_problem"], str):
                raise ValueError("invalid baseline problem")
            uncertain = uncertain or bool(data["baseline_problem"])
        nested = set()
        for model in models:
            impacts = model.get("downstream_impacts", [])
            if not isinstance(impacts, list):
                raise ValueError("invalid downstream impacts")
            for impact in impacts:
                if not isinstance(impact, dict) or any(
                    not isinstance(impact.get(key), str) for key in ("model_name", "risk", "reason")
                ):
                    raise ValueError("invalid downstream impact")
                nested.add("destructive" if impact["risk"] in ("broken_ref", "inherited_drop") else "warning")
        # The validator ships in the base wheel and imports only the stdlib.
        # Old pinned CLIs have no canonical field and need no new module.
        if "findings" in data or "causal_graph" in data:
            from dbt_plan_mcp.report_validation import validate_report, report_severity
            nested.add(report_severity(validate_report(data)))
        print("destructive" if counts["destructive"] or "destructive" in nested else
              "warning" if counts["warning"] or uncertain or "warning" in nested else "safe")
        PY
        ); then
          echo "::error::dbt-plan did not produce a completed JSON report (exit $code)"
          exit 3
        fi
        if [ "$SUMMARY" = "true" ]; then
          dbt-plan check --target-dir "$TARGET_DIR" "$@" --format github >> "$GITHUB_STEP_SUMMARY" || true
        fi
        dbt-plan check --target-dir "$TARGET_DIR" "$@" --no-color || true
        {
          echo "verdict=$verdict"
          echo "exit-code=$code"
          echo "report=$report"
        } >> "$GITHUB_OUTPUT"

    - name: Gate
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on }}
        VERDICT: ${{ steps.check.outputs.verdict }}
        CODE: ${{ steps.check.outputs.exit-code }}
      run: |
        set -u
        fail() { echo "::error::dbt-plan verdict: $VERDICT"; exit 1; }
        case "$FAIL_ON" in
          never)       exit 0 ;;
          destructive) [ "$CODE" = "1" ] && fail; exit 0 ;;
          warning)     [ "$CODE" = "0" ] || fail; exit 0 ;;
          *) echo "::error::fail-on must be destructive, warning, or never (got '$FAIL_ON')"; exit 1 ;;
        esac
